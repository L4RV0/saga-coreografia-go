name: CI - Saga Coreografía

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Análisis, pruebas y cobertura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Formato (gofmt)
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: Análisis estático (go vet)
        run: go vet ./...

      - name: Pruebas con detector de condiciones de carrera
        run: go test -race -count=1 -v -coverpkg=./... -coverprofile=coverage.out ./...

      - name: Reporte de cobertura
        run: |
          go tool cover -func=coverage.out
          go tool cover -html=coverage.out -o coverage.html

      - uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: coverage.html

      - name: Ejecutar la demo de los 3 escenarios
        run: go run .

  docker:
    name: Imagen Docker
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir imagen
        run: docker build -t saga-coreografia:ci .
      - name: Ejecutar contenedor
        run: docker run --rm saga-coreografia:ci
